{{define "main"}}
<h1>Reading Queue</h1>
{{/* Step 4 scaffolding: proves the Datastar round-trip. Replaced in step 5. */}}
<section data-signals="{name: '', count: 0}">
  <input data-bind:name placeholder="name">
  <button data-on:click="@get('{{.PingPath}}')">Ping</button>
  <span>pings: <span data-text="$count"></span></span>
  {{template "ping" .}}
</section>
{{end}}

{{define "ping"}}<div id="ping">{{if .Name}}Hello, {{.Name}}. Server time {{.Time}}{{end}}</div>{{end}}
