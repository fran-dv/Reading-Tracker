{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#120f0c">
  <title>Reading Tracker</title>
  <link rel="preload" href="/static/fonts/AlegreyaSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/datastar.js"></script>
  <script type="module" src="/static/picker.js"></script>
</head>
<body class="{{block "body-class" .}}{{end}}">
  <header class="head">
    <a class="head-name" href="/">Reading Tracker</a>
    <nav class="head-nav" aria-label="Sections">
      {{range .Nav}}<a href="{{.Href}}"{{if .Current}} aria-current="page"{{end}}>{{.Name}}</a>
      {{end}}
    </nav>
  </header>
  <main id="main" class="page">
    {{template "main" .}}
  </main>
</body>
</html>
{{end}}
